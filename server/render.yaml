services:
  - type: web
    name: small-web-reader-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w server
    startCommand: npm run start -w server
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: small_web_reader
      - key: CLIENT_ORIGIN
        sync: false
